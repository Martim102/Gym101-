<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym101% — Criar conta</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="pagina-auth">
    <div class="auth-lado-visual">
        <div id="seletorIdiomaDestino" style="position:absolute; top:24px; right:24px;"></div>
        <div>
            <h1><span data-i18n="registo_hero_titulo_1">A tua evolução,</span><br><span data-i18n="registo_hero_titulo_2">com</span> <span style="color:var(--amarelo);" data-i18n="registo_hero_titulo_2b">números</span><span data-i18n="registo_hero_titulo_3"> à frente.</span></h1>
            <p data-i18n="registo_hero_texto">Regista treinos, pesa-te, planeia as refeições e desafia os teus amigos para veres quem chega mais longe este mês.</p>
        </div>
    </div>

    <div class="auth-lado-form">
        <h2 style="margin-bottom: 6px;" data-i18n="registo_titulo">Criar conta</h2>
        <p style="color: var(--cinza); margin-bottom: 28px;"><span data-i18n="registo_tem_conta">Já tens conta?</span> <a href="index.html" data-i18n="registo_entrar_aqui">Entra aqui</a></p>

        <div class="mensagem-erro" id="caixaErro"></div>

        <form id="formularioRegisto">
            <div class="campo">
                <label for="nome" data-i18n="registo_nome">Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label for="email" data-i18n="login_email">Email</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="password" data-i18n="login_password">Palavra-passe</label>
                <input type="password" id="password" required minlength="6" autocomplete="new-password">
                <span style="font-size:0.78rem; color: var(--cinza);" data-i18n="registo_password_dica">Mínimo 6 caracteres.</span>
            </div>
            <button type="submit" class="botao botao-principal" style="width:100%; margin-top: 8px;" data-i18n="registo_botao">Criar a minha conta</button>
        </form>
    </div>
</div>

<script src="js/traducoes.js"></script>
<script src="js/i18n.js"></script>
<script src="js/comum.js"></script>
<script>inserirSeletorIdioma(document.getElementById("seletorIdiomaDestino"));</script>
<script>
document.getElementById("formularioRegisto").addEventListener("submit", async (e) => {
    e.preventDefault();
    const caixaErro = document.getElementById("caixaErro");
    try {
        await chamarApi("/auth/registo.php", {
            method: "POST",
            body: JSON.stringify({
                nome: document.getElementById("nome").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });
        window.location.href = "paginas/dashboard.html";
    } catch (erro) {
        mostrarErro(caixaErro, erro.message);
    }
});
</script>
</body>
</html>
